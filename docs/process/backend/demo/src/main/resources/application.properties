spring.application.name=demo

# ── 데이터소스 ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/meetudy?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true
spring.datasource.username=root

spring.datasource.password=MEETUDY1234

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── SQL 자동 초기화 비활성화 ─────────────────────────────────
# DB는 Workbench에서 직접 관리 → Spring이 건드리지 않음
spring.sql.init.mode=never



spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ── JWT ─────────────────────────────────────────────────────
# secret은 256bit(32자) 이상의 문자열로 변경 권장
# ── JWT ─────────────────────────────────────────────────────
jwt.secret=meetudy-jwt-secret-key-must-be-at-least-256bits-long!!
# Access Token: 1시간
jwt.expiration-ms=3600000
# Refresh Token: 14일
jwt.refresh-expiration-ms=1209600000



# 카카오 API
kakao.api.key=YOUR_KEY

# Flyway 설정
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration


